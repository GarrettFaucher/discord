[package]
name = "equibop"
edition = "2024"

[dependencies]
openaction = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = "0.3"
log = "0.4"
simplelog = "0.12"

[profile.release]
strip = true
lto = "thin"
panic = "abort"
